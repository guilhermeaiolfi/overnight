name: CI

on:
  push:
    branches:
      - master
      - main
      - "1.*"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overnight
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: overnight
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('overnight/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP formatting
        if: matrix.php == '8.3'
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

      - name: Run PHPUnit
        run: php vendor/bin/phpunit

      - name: Run PHPStan
        run: composer analyse
