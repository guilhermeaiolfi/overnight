name: CI

on:
  push:
    branches:
      - master
      - main
      - "1.*"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overnight
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: overnight
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Find locked overnight-data revision
        id: overnight-data
        run: |
          php <<'PHP' >> "$GITHUB_OUTPUT"
          <?php
          $lock = json_decode(file_get_contents('composer.lock'), true, flags: JSON_THROW_ON_ERROR);
          foreach ($lock['packages'] as $package) {
              if ($package['name'] !== 'guilhermeaiolfi/overnight-data') {
                  continue;
              }
              if (($package['dist']['type'] ?? null) !== 'path') {
                  exit(0);
              }
              $revision = $package['dist']['reference'] ?? '';
              if (!preg_match('/\A[0-9a-f]{40}\z/', $revision)) {
                  file_put_contents('php://stderr', "Expected a Git commit for the overnight-data path dependency.\n");
                  exit(1);
              }
              echo "revision=$revision\n";
              exit(0);
          }
          PHP

      - name: Checkout overnight-data for Composer's ../ondata repository
        if: steps.overnight-data.outputs.revision != ''
        uses: actions/checkout@v5
        with:
          repository: guilhermeaiolfi/overnight-data
          ref: ${{ steps.overnight-data.outputs.revision }}
          path: ondata
          persist-credentials: false

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('overnight/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: php vendor/bin/phpunit

      - name: Run PHPStan
        run: composer analyse
